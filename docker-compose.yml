services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: fmv-infrasec-portfolio:latest
    container_name: fmv-infrasec-portfolio
    restart: unless-stopped
    ports:
      - "${PORTFOLIO_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
